;===================================================================
; K4H818.ini  - user-defined configuration for K4H818-prog -d
;	settings applied when the "user .ini file" choice is selected
;===================================================================
;
; txFreq. Transmit frequency in MHz (xxx.xxx). Must fall within
; 144.000-148.000, 222.000-225.000, or 420.000-450.000.
; for example: txFreq = 146.520
txFreq = 146.520
;
; rxFreq. Receive frequency in MHz (xxx.xxx). Same valid ranges as txFreq.
; for example: rxFreq = 146.520
rxFreq = 146.520
;
; txcssType. Transmit sub-audible tone type.
; 0=none, 1=CTCSS, 2=CDCSS, 3=CTCSS with STE, 4=CDCSS with STE
; for example: txcssType = 1
txcssType = 1
;
; txCTCSS. Transmit CTCSS tone frequency in Hz. Only used if txcssType
; is 1 or 3. for example: txCTCSS = 100.0
txCTCSS = 100.0
;
; txCDCSScode. Transmit CDCSS code, 3 digits. Only used if txcssType is
; 2 or 4. for example: txCDCSScode = 023
txCDCSScode = 023
;
; txCDCSSpolarity. Transmit CDCSS polarity. N=Normal, I=Inverted. Only
; used if txcssType is 2 or 4. for example: txCDCSSpolarity = N
txCDCSSpolarity = N
;
; rxcssType. Receive sub-audible tone type. Same scheme as txcssType.
; for example: rxcssType = 1
rxcssType = 1
;
; rxCTCSS. Receive CTCSS tone frequency in Hz. Only used if rxcssType
; is 1 or 3. for example: rxCTCSS = 100.0
rxCTCSS = 100.0
;
; rxCDCSScode. Receive CDCSS code, 3 digits. Only used if rxcssType is
; 2 or 4. for example: rxCDCSScode = 023
rxCDCSScode = 023
;
; rxCDCSSpolarity. Receive CDCSS polarity. N=Normal, I=Inverted. Only
; used if rxcssType is 2 or 4. for example: rxCDCSSpolarity = N
rxCDCSSpolarity = N
;
; squelch. Squelch setting. 0 to 15. for example: squelch = 5
squelch = 5
;
; rxVolume. Friendly RX Volume index. 0 to 39. for example: rxVolume = 30
rxVolume = 30
;
; bypassPreDe. Bypass Pre/De-emphasis. Y or N.
; for example: bypassPreDe = N
bypassPreDe = N
;
; bypassVoiceHPF. Bypass Voice High Pass Filter. Y or N.
; for example: bypassVoiceHPF = N
bypassVoiceHPF = N
;
; bypassVoiceLPF. Bypass Voice Low Pass Filter. Y or N.
; for example: bypassVoiceLPF = N
bypassVoiceLPF = N
;
; bypassCtcssHPF. Bypass CTCSS/CDCSS High Pass Filter. Y or N.
; for example: bypassCtcssHPF = N
bypassCtcssHPF = N
;
; bypassCtcssLPF. Bypass CTCSS/CDCSS Low Pass Filter. Y or N.
; for example: bypassCtcssLPF = N
bypassCtcssLPF = N
;
; bypassRSSIlpf. Bypass RSSI Low Pass Filter. Y or N.
; for example: bypassRSSIlpf = N
bypassRSSIlpf = N
;
; txGainNibble. OPTIONAL, expert-level setting -- TX gain, register
; 44H[11:8]. 0 to 15. If omitted, defaults to 0x0B (11), the validated
; value. for example: txGainNibble = 11
txGainNibble = 11
